<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Página en construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#080b0e;color:#fff;font-family:'Space Grotesk',sans-serif}.grid{position:fixed;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle,#000 20%,transparent 75%)}.glow{position:fixed;width:500px;height:500px;border-radius:50%;background:#156bff;filter:blur(160px);opacity:.18}.card{position:relative;text-align:center;padding:48px 24px}.tag{font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:#32d5ff;text-transform:uppercase}.line{width:64px;height:2px;background:#156bff;margin:22px auto}h1{font-size:clamp(48px,9vw,110px);line-height:.92;letter-spacing:-.06em;margin:0;max-width:900px}.status{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:12px 16px;border:1px solid #ffffff22;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#aebac5}.dot{width:8px;height:8px;border-radius:50%;background:#32d5ff;box-shadow:0 0 14px #32d5ff;animation:pulse 1.6s infinite}.credit{margin-top:60px;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#6f7c87}.credit b{color:#fff}@keyframes pulse{50%{opacity:.25;transform:scale(.75)}}
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <main class="card">
    <div class="tag">Cabañas Rivas Pezoa</div>
    <div class="line"></div>
    <h1>Página en<br>construcción</h1>
    <div class="status"><span class="dot"></span>Estamos preparando una nueva experiencia</div>
    <div class="credit">Creado por <b>RIPE_05</b></div>
  </main>
</body>
</html>
